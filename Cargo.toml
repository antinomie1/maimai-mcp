[package]
name = "maimai-mcp"
version = "0.3.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.1.3", features = ["server"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "form"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
ab_glyph = "0.2.32"
rayon = "1.12.0"
strsim = "0.11.1"
base64 = "0.23.1"
schemars = "1"
sha2 = "0.11.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
