name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: maimai-mcp
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: maimai-mcp.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.3.0}"
          PKG_NAME="maimai-mcp-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${PKG_NAME}/"
          cp README.md LICENSE "dist/${PKG_NAME}/" || true
          if [ -d "docs" ]; then cp -r docs "dist/${PKG_NAME}/"; fi
          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          echo "ARCHIVE_NAME=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          echo "ARCHIVE_PATH=dist/${PKG_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG_NAME = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.3.0" }
          $PKG_NAME = "maimai-mcp-$TAG_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$PKG_NAME"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/$PKG_NAME/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$PKG_NAME/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$PKG_NAME/" }
          if (Test-Path "docs") { Copy-Item -Recurse "docs" "dist/$PKG_NAME/" }
          Compress-Archive -Path "dist/$PKG_NAME/*" -DestinationPath "dist/$PKG_NAME.zip"
          echo "ARCHIVE_NAME=$PKG_NAME.zip" >> $env:GITHUB_ENV
          echo "ARCHIVE_PATH=dist/$PKG_NAME.zip" >> $env:GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true
